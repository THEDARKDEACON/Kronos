global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kronos-pipeline'
    static_configs:
      - targets: ['kronos-pipeline:8000']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'kronos-dashboard'
    static_configs:
      - targets: ['kronos-dashboard:8501']
    scrape_interval: 30s

  - job_name: 'kronos-health'
    static_configs:
      - targets: ['kronos-pipeline:8000']
    metrics_path: /health/metrics
    scrape_interval: 60s
